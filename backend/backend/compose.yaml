services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: levelmate
      POSTGRES_USER: levelmate
      POSTGRES_PASSWORD: levelmate
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U levelmate -d levelmate"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    ports:
      - "8080:8080"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: levelmate
      DB_USERNAME: levelmate
      DB_PASSWORD: levelmate
      # Override JWT_SECRET in production via env var or .env file
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
