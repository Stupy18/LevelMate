spring:
  application:
    name: backend
  docker:
    compose:
      enabled: false
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:levelmate}
    username: ${DB_USERNAME:levelmate}
    password: ${DB_PASSWORD:levelmate}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

app:
  jwt:
    # Base64-encoded secret — must decode to ≥ 32 bytes. Override via JWT_SECRET env var in production.
    secret: ${JWT_SECRET:dGhpcy1pcy1hLWRldi1vbmx5LXNlY3JldC1rZXktZG9ub3R1c2VpbnByb2Q=}
    access-token-expiry: 900000      # 15 minutes in ms
    refresh-token-expiry: 2592000000 # 30 days in ms
