services:
  expo:
    image: node:20-alpine
    working_dir: /app
    tty: true        # allocate a pseudo-TTY so Expo's QR code UI renders
    stdin_open: true
    volumes:
      - .:/app
      - expo_modules:/app/node_modules  # isolated from host node_modules
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go protocol
      - "19001:19001" # Expo tunnel/web
    environment:
      EXPO_PUBLIC_API_URL: http://${HOST_IP:-localhost}:8080
      # Tells Metro what IP to advertise in the QR code.
      # Docker's --host lan detects the container's internal IP, not yours,
      # so we set this explicitly from HOST_IP in .env
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-localhost}
    command: >
      sh -c "
        npm install --legacy-peer-deps --silent &&
        npx expo start --port 8081
      "

volumes:
  expo_modules:
