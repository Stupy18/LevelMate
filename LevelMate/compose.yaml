services:
  expo:
    build:
      context: .
      dockerfile: Dockerfile.dev
    tty: true
    stdin_open: true
    ports:
      - "8081:8081"   # Metro bundler
      - "19000:19000" # Expo Go protocol
      - "19001:19001" # Expo tunnel/web
    environment:
      EXPO_PUBLIC_API_URL: http://${HOST_IP:-10.0.2.2}:8080
      REACT_NATIVE_PACKAGER_HOSTNAME: ${HOST_IP:-10.0.2.2}

volumes:
  expo_modules:
